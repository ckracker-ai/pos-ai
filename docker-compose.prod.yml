# Overlay de producción / VPS — NO reemplaza docker-compose.yml
#
# Desarrollo:
#   docker compose up -d --build
#
# Producción con Nginx:
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: pos-ai-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      FRONTEND_UPSTREAM: pos-frontend:80
      BFF_UPSTREAM: pos-api-bff:2020
      SSL_MODE: ${SSL_MODE:-auto}
    volumes:
      - ./nginx/conf.d/00-http.conf:/etc/nginx/conf.d/00-http.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    networks:
      - public_gateway
    depends_on:
      - pos-frontend
      - pos-api-bff
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pos-frontend:
    ports: !reset
    environment:
      BFF_INTERNAL_URL: http://pos-api-bff:2020
      AUTH_URL: http://pos-api-bff:2020
    build:
      context: ./pos-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        BFF_INTERNAL_URL: http://pos-api-bff:2020
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-2.0.2026-09-15}

  pos-api-bff:
    ports: !reset
    environment:
      NODE_ENV: production
      COOKIE_SECURE: 'true'
      APP_VERSION: ${APP_VERSION:-2.0.2026-09-15}
    volumes: !reset

  pos-ai-mailpit:
    profiles: [local-mail]
    ports: !reset

  pos-api-core:
    volumes: !reset
    environment:
      APP_VERSION: ${APP_VERSION:-2.0.2026-09-15}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-POS-AI <noreply@pos-ai.cl>}

  certbot:
    profiles: [certbot]
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/html:/usr/share/nginx/html
    networks:
      - public_gateway

  pos-api-assistant:
    ports: !reset

  pos-ai-redis:
    command: redis-server --save "" --appendonly no --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env.prod}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env.prod}

  pos-ai-db-mysql:
    ports: !reset
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in .env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pos-ai-db}
      MYSQL_USER: ${MYSQL_USER:-usr_pos_core}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in .env.prod}
      MYSQL_READONLY_USER: ${MYSQL_READONLY_USER:-usr_pos_readonly}
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD:?MYSQL_READONLY_PASSWORD is required in .env.prod}
