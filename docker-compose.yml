name: pos-ai

services:
  # ==========================================
  # POS-AI v1.4 — Frontend (host :8010)
  # ==========================================
  pos-frontend:
    build:
      context: ./pos-frontend
      args:
        NEXT_PUBLIC_API_URL: ''
        BFF_INTERNAL_URL: http://pos-api-bff:2020
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-2.0.2026-09-15}
    container_name: pos-ai-frontend
    restart: unless-stopped
    ports:
      - '8010:80'
    environment:
      BFF_INTERNAL_URL: http://pos-api-bff:2020
      AUTH_URL: http://pos-api-bff:2020
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-2.0.2026-09-15}
    networks:
      - public_gateway
    depends_on:
      pos-api-bff:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ==========================================
  # POS-AI v1.4 — BFF (host :2020, prefijo /pos/proxy)
  # ==========================================
  pos-api-bff:
    build: ./pos-api-bff
    container_name: pos-ai-api-bff
    restart: unless-stopped
    user: "1000:1000"
    command: sh -c "npm ci && node dist/server.js"
    ports:
      - '2020:2020'
    environment:
      - NODE_ENV=development
      - PORT=2020
      - API_PREFIX=/pos/proxy
      - CORE_API_BASE_URL=http://pos-api-core:1010
      - ASSISTANT_API_BASE_URL=http://pos-api-assistant:3030
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-pos_ai_internal_dev_only_key_32bxx}
      - SUBSCRIPTION_WEBHOOK_SECRET=${SUBSCRIPTION_WEBHOOK_SECRET:-pos_ai_sub_webhook_dev_only_32xxx}
      - PAYMENT_GATEWAY_WEBHOOK_SECRET=${PAYMENT_GATEWAY_WEBHOOK_SECRET:-pos_ai_pay_gateway_dev_only_32xx}
      - PAYMENT_WEBHOOK_HMAC_SECRET=${PAYMENT_WEBHOOK_HMAC_SECRET:-pos_ai_pay_hmac_dev_only_32chars}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost:8010}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-platform@pos-ai.local}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:-PlatformAdmin2026!}
      - JWT_SECRET=${JWT_SECRET:-pos_ai_jwt_secret_key_2026_dev_only_32}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-pos_ai_jwt_refresh_secret_2026}
      - APP_VERSION=${APP_VERSION:-2.0.2026-09-15}
      - REDIS_URL=${REDIS_URL:-redis://:pos_ai_redis_dev_only_pass_32xx@pos-ai-redis:6379}
      - SESSION_TTL_SEC=${SESSION_TTL_SEC:-28800}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8010,http://127.0.0.1:8010,https://pos-ai.cl,https://www.pos-ai.cl}
      - RATE_LIMIT_GLOBAL_MAX=${RATE_LIMIT_GLOBAL_MAX:-100}
      - RATE_LIMIT_LOGIN_MAX=${RATE_LIMIT_LOGIN_MAX:-5}
    volumes:
      - ./pos-api-bff:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - public_gateway
      - internal_backend
    depends_on:
      pos-api-core:
        condition: service_healthy
      pos-api-assistant:
        condition: service_healthy
      pos-ai-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2020/pos/proxy/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ==========================================
  # POS-AI v1.7 — Assistant WhatsApp (plan Estándar, puerto 3030)
  # ==========================================
  pos-api-assistant:
    build: ./pos-api-assistant
    container_name: pos-ai-api-assistant
    restart: unless-stopped
    ports:
      - '3030:3030'
    environment:
      - NODE_ENV=development
      - PORT=3030
      - CORE_API_BASE_URL=http://pos-api-core:1010
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-pos_ai_internal_dev_only_key_32bxx}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-pos-ai-dev-verify}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v21.0}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - REDIS_URL=${REDIS_URL:-redis://:pos_ai_redis_dev_only_pass_32xx@pos-ai-redis:6379}
    networks:
      - internal_backend
      - public_gateway
    depends_on:
      pos-api-core:
        condition: service_healthy
      pos-ai-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3030/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # POS-AI v1.4 — Core API (multi-tenant, puerto 1010)
  # ==========================================
  pos-api-core:
    build: ./pos-api-core
    container_name: pos-ai-api-core
    user: "1000:1000"
    ports:
      - '1010:1010'
    environment:
      - NODE_ENV=production
      - DB_SYNC_ALTER=false
      - DB_SEED_ROLES=true
      - PORT=1010
      - CORE_PORT=1010
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-pos_ai_internal_dev_only_key_32bxx}
      - RATE_LIMIT_GLOBAL_MAX=${RATE_LIMIT_GLOBAL_MAX:-100}
      - RATE_LIMIT_LOGIN_MAX=${RATE_LIMIT_LOGIN_MAX:-5}
      - JWT_SECRET=${JWT_SECRET:-pos_ai_jwt_secret_key_2026_dev_only_32}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-pos_ai_field_encryption_key_2026_32bytes_min}
      - BOOTSTRAP_ADMIN_ENABLED=${BOOTSTRAP_ADMIN_ENABLED:-true}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@empanadascostaazul.cl}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-@dmin123_}
      - BOOTSTRAP_ADMIN_FULL_NAME=${BOOTSTRAP_ADMIN_FULL_NAME:-Administrador Costa Azul}
      - BOOTSTRAP_ADMIN_BRANCH_NAME=${BOOTSTRAP_ADMIN_BRANCH_NAME:-Sucursal Central}
      - BOOTSTRAP_ADMIN_RESET_PASSWORD=${BOOTSTRAP_ADMIN_RESET_PASSWORD:-false}
      - BOOTSTRAP_DEMO_USERS_ENABLED=${BOOTSTRAP_DEMO_USERS_ENABLED:-true}
      - BOOTSTRAP_SELLER_EMAIL=${BOOTSTRAP_SELLER_EMAIL:-vendedor@empanadascostaazul.cl}
      - BOOTSTRAP_SELLER_PASSWORD=${BOOTSTRAP_SELLER_PASSWORD:-Vendedor@12345}
      - BOOTSTRAP_DEMO_USERS_RESET_PASSWORD=${BOOTSTRAP_DEMO_USERS_RESET_PASSWORD:-false}
      - BOOTSTRAP_PLATFORM_ADMIN_ENABLED=${BOOTSTRAP_PLATFORM_ADMIN_ENABLED:-true}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-platform@pos-ai.local}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:-PlatformAdmin2026!}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost:8010}
      - SMTP_HOST=${SMTP_HOST:-pos-ai-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-POS-AI <noreply@pos-ai.local>}
      - APP_VERSION=${APP_VERSION:-2.0.2026-09-15}
      - REDIS_URL=${REDIS_URL:-redis://:pos_ai_redis_dev_only_pass_32xx@pos-ai-redis:6379}
      - AUTH_USER_CACHE_TTL_SEC=${AUTH_USER_CACHE_TTL_SEC:-600}
      - PAYMENT_LINK_BASE_URL=${PAYMENT_LINK_BASE_URL:-https://pay.pos-ai.local/p}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-SANDBOX}
      - WEBPAY_MODE=${WEBPAY_MODE:-simulate}
      - WEBPAY_COMMERCE_CODE=${WEBPAY_COMMERCE_CODE:-}
      - WEBPAY_API_SECRET=${WEBPAY_API_SECRET:-}
      - PAYMENT_SANDBOX_RETURN_BASE_URL=${PAYMENT_SANDBOX_RETURN_BASE_URL:-http://localhost:8010}
      - WEBPAY_API_BASE_URL=${WEBPAY_API_BASE_URL:-https://webpay3gint.transbank.cl}
      - PAYMENT_CHECKOUT_TOKEN_SECRET=${PAYMENT_CHECKOUT_TOKEN_SECRET:-pos_ai_pay_checkout_dev_only_32x}
      - PAYMENT_WEBHOOK_HMAC_SECRET=${PAYMENT_WEBHOOK_HMAC_SECRET:-pos_ai_pay_hmac_dev_only_32chars}
      - DB_HOST=${DB_HOST:-pos-ai-db-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-pos-ai-db}
      - DB_USER=${DB_USER:-usr_pos_core}
      - DB_PASSWORD=${DB_PASSWORD:-pos_ai_mysql_core_dev_only_32x}
      - DB_SSL=${DB_SSL:-false}
      - DB_SSL_REJECT_UNAUTHORIZED=${DB_SSL_REJECT_UNAUTHORIZED:-true}
    volumes:
      - ./pos-api-core:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - internal_backend
      - public_gateway
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      pos-ai-db-mysql:
        condition: service_healthy
        required: false
      pos-ai-redis:
        condition: service_healthy
      pos-ai-mailpit:
        condition: service_healthy
        required: false
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:1010/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # Redis — cache auth, job locks, sesiones assistant (6379 interno)
  # ==========================================
  pos-ai-redis:
    image: redis:7-alpine
    container_name: pos-ai-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --requirepass ${REDIS_PASSWORD:-pos_ai_redis_dev_only_pass_32xx}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-pos_ai_redis_dev_only_pass_32xx}
    networks:
      - internal_backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================
  # Mailpit — SMTP de desarrollo hasta Amazon SES
  # UI: http://localhost:8025  |  SMTP interno: pos-ai-mailpit:1025
  # No entrega correo real; captura OTP y transaccionales.
  # ==========================================
  pos-ai-mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: pos-ai-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - internal_backend
      - public_gateway
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/readyz']
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 8s

  # ==========================================
  # MySQL local — pos-ai-db (3306 interno; host 3308)
  # En RDS: overlay docker-compose.rds.yml (este servicio no arranca).
  # ==========================================
  pos-ai-db-mysql:
    image: mysql:8.0
    container_name: pos-ai-db-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '${MYSQL_HOST_PORT:-3308}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pos_ai_mysql_root_dev_only_32x}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pos-ai-db}
      MYSQL_USER: ${MYSQL_USER:-usr_pos_core}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pos_ai_mysql_core_dev_only_32x}
      MYSQL_READONLY_USER: ${MYSQL_READONLY_USER:-usr_pos_readonly}
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD:-pos_ai_mysql_ro_dev_only_32xx}
    volumes:
      - pos_ai_mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - internal_backend
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  public_gateway:
    driver: bridge
  internal_backend:
    internal: true

volumes:
  pos_ai_mysql_data:
    driver: local
